function hashString(str) {
  // Deterministic 32-bit hash of the exact filename string.

  return h >>> 0;

    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function colorFor(filename) {
  return COLORS[hashString(filename) % COLORS.length];
}

function showEntry(column, index) {
  const entry = COLUMNS[column][index];
  cols[column].textContent = entry.text.replace(/\n/g, "\n\n");
  cols[column].style.color = colorFor(entry.filename);
}

function nextIndex(column, index) {
  return (index + 1) % COLUMNS[column].length;
}

function expandedIndexAt(column, beat) {
  // Every source entry is repeated exactly its source count times.
  const entries = COLUMNS[column];
  let n = beat;
  for (let i = 0; i < entries.length; i++) {
    if (n < entries[i].count) return i;
    n -= entries[i].count;
  }
  return 0;
}

function renderAt(perfNow) {
  if (!running) return;

  // Same cadence as the supplied prototype: each column changes after
  // 1200–5000 ms, with columns initially staggered by 500 ms.
  // All timestamps are still derived from one master performance.now() clock.
  for (let column = 0; column < COLUMNS.length; column++) {
    while (perfNow >= nextVisualTimes[column]) {
      const index = nextIndex(column, visualIndex[column]);
      visualIndex[column] = index;

      const eventTime = nextVisualTimes[column];
      showEntry(column, index);

      const r = paceRng[column]();
      nextVisualTimes[column] +=
        MIN_CHANGE_MS + r * (MAX_CHANGE_MS - MIN_CHANGE_MS);
    }
  }

  rafId = requestAnimationFrame(renderAt);
}

function startInstallation() {
  if (running) return;

  masterPerfStart = performance.now();
  running = true;
  visualIndex.fill(0);

  for (let column = 0; column < COLUMNS.length; column++) {
    showEntry(column, 0);

    const initialTime = masterPerfStart + column * INITIAL_STAGGER_MS;
    const r = paceRng[column]();
    nextVisualTimes[column] =
      initialTime + MIN_CHANGE_MS + r * (MAX_CHANGE_MS - MIN_CHANGE_MS);
  }

  requestAnimationFrame(renderAt);
}

function enterInstallation() {
  if (running) return;
  enter.style.display = "none";
  startInstallation();
}

enter.addEventListener("click", enterInstallation);
enter.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    enterInstallation();
  }
});

</script>
